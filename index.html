<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Такт</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101218'/%3E%3Crect x='7' y='5' width='18' height='22' rx='2' fill='%234d8dff'/%3E%3Crect x='17' y='5' width='5' height='13' fill='%2314171d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Такт</h1>
        <p>Ждать ноту или прослушать фрагмент. Колесо перематывает.</p>
      </div>
      <div class="file-row">
        <label class="btn" for="file">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5l2 2h9v9H4z"/></svg>
          <span>Открыть MIDI</span>
        </label>
        <input id="file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" />
        <button id="sample" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v9"/><circle cx="7" cy="18" r="2.4" fill="currentColor" stroke="none"/></svg>
          <span>Пример</span>
        </button>
        <label class="field">
          Вход
          <select id="device" disabled>
            <option value="">Сначала подключите MIDI</option>
          </select>
        </label>
        <label class="field">
          Выход
          <select id="output">
            <option value="">Звук браузера</option>
          </select>
        </label>
        <button id="midi" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5M12 3v5M16 3v5"/><path d="M7 8h10v5a5 5 0 0 1-10 0z"/></svg>
          <span class="lbl">Подключить MIDI</span>
        </button>
      </div>
    </header>

    <div class="controls">
      <div class="group">
      <button id="play" type="button" disabled title="Пробел" data-state="play">
        <svg class="ico fill ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="ico fill ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
        <span class="lbl">Старт</span>
      </button>
      <label class="field speed">
        Скорость
        <input id="speed" type="range" min="50" max="100" step="5" value="100" />
        <span id="speed-value">100%</span>
      </label>
      </div>
      <div class="group">
      <div class="seg" id="hands" role="group" aria-label="Рука">
        <button type="button" data-hand="L" title="Левая рука">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V6.5a1.6 1.6 0 0 1 3.2 0V11"/><path d="M11.2 10V4.8a1.6 1.6 0 0 1 3.2 0V11"/><path d="M14.4 10.5V7a1.6 1.6 0 0 1 3.2 0v6.2c0 3.6-2.2 6.3-6.2 6.3h-1.2C6.6 19.5 4 17 4 13.6c0-1.6.6-2.6 1.8-3 1-.3 2 .2 2.2 1.2"/></svg>
          <span>Левая</span>
        </button>
        <button type="button" data-hand="R" title="Правая рука">
          <svg class="ico flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V6.5a1.6 1.6 0 0 1 3.2 0V11"/><path d="M11.2 10V4.8a1.6 1.6 0 0 1 3.2 0V11"/><path d="M14.4 10.5V7a1.6 1.6 0 0 1 3.2 0v6.2c0 3.6-2.2 6.3-6.2 6.3h-1.2C6.6 19.5 4 17 4 13.6c0-1.6.6-2.6 1.8-3 1-.3 2 .2 2.2 1.2"/></svg>
          <span>Правая</span>
        </button>
        <button type="button" data-hand="both" aria-pressed="true" title="Обе руки">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13V9.5a1.2 1.2 0 0 1 2.4 0V13"/><path d="M4.4 12V8a1.2 1.2 0 0 1 2.4 0V13"/><path d="M6.8 12.2V9.2a1.2 1.2 0 0 1 2.4 0v4.2c0 2.4-1.4 4.1-4 4.1H6c-2.2 0-3.6-1.4-3.6-3.6 0-1 .4-1.7 1.2-2"/><path d="M13 13V9.5a1.2 1.2 0 0 1 2.4 0V13"/><path d="M15.4 12V8a1.2 1.2 0 0 1 2.4 0V13"/><path d="M17.8 12.2V9.2a1.2 1.2 0 0 1 2.4 0v4.2c0 2.4-1.4 4.1-4 4.1h-.6c-2.2 0-3.6-1.4-3.6-3.6 0-1 .4-1.7 1.2-2"/></svg>
          <span>Обе</span>
        </button>
      </div>
      <div class="seg" id="modes" role="group" aria-label="Режим">
        <button type="button" data-mode="wait" aria-pressed="true" title="Ждать ноту">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
          <span>Ждать</span>
        </button>
        <button type="button" data-mode="listen" title="Прослушать фрагмент">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h3l5-4v12l-5-4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a6.5 6.5 0 0 1 0 10"/></svg>
          <span>Слушать</span>
        </button>
      </div>
      </div>
      <div class="group">
      <label class="field">
        Размер
        <select id="meter">
          <option value="">как в файле</option>
          <option value="3/4">3/4</option>
          <option value="4/4">4/4</option>
          <option value="2/4">2/4</option>
          <option value="6/8">6/8</option>
          <option value="5/4">5/4</option>
          <option value="7/8">7/8</option>
          <option value="9/8">9/8</option>
          <option value="12/8">12/8</option>
          <option value="3/8">3/8</option>
          <option value="2/2">2/2</option>
        </select>
      </label>
      <label class="field">
        Такт от
        <input id="bar-from" type="number" min="1" max="1" value="1" />
      </label>
      <label class="field">
        Такт до
        <input id="bar-to" type="number" min="1" max="1" value="1" />
      </label>
      <button id="loop" type="button" aria-pressed="false" title="Повторять такты">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a6 6 0 0 1 6-6h8"/><path d="M15 3l3 3-3 3"/><path d="M20 12a6 6 0 0 1-6 6H6"/><path d="M9 21l-3-3 3-3"/></svg>
        <span class="lbl">Зациклить</span>
      </button>
      <label class="field split" id="split-wrap" hidden>
        Разрез, ниже — левая
        <input id="split" type="range" min="36" max="84" value="60" />
        <span id="split-name">до4</span>
      </label>
      </div>
    </div>

    <div id="tracks" class="tracks"></div>
    <p id="status" class="status">Откройте MIDI или нажмите «Пример».</p>
    <div class="stage-wrap">
      <canvas id="stage" aria-label="Нотный стан и клавиатура" title="Колесо вверх — назад, вниз — вперёд"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
